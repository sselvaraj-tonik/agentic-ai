<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Agent AI - Chat Support</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --container-bg: rgba(26, 29, 38, 0.6);
            --primary-glow: rgba(99, 102, 241, 0.15);
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --accent-color: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --bot-bubble-bg: rgba(31, 41, 55, 0.7);
            --user-bubble-bg: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.1) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
            overflow: hidden;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            height: 85vh;
            background: var(--container-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
            overflow: hidden;
            position: relative;
        }

        /* Header Styling */
        .chat-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(17, 24, 39, 0.4);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-container {
            width: 48px;
            height: 48px;
            background: rgba(99, 102, 241, 0.2);
            border: 2px solid var(--primary-color);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-size: 1.4rem;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .header-title-wrapper h1 {
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #fff 0%, #d1d5db 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .thread-input-group {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 4px 8px;
        }

        .thread-input-group label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-right: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .thread-input {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            width: 130px;
            text-align: right;
        }

        /* Messages Display */
        .chat-messages {
            flex: 1;
            padding: 24px 28px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.bot {
            justify-content: flex-start;
        }

        .message-wrapper {
            max-width: 75%;
            display: flex;
            gap: 12px;
        }

        .user .message-wrapper {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0;
        }

        .bot .avatar {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.4);
            color: var(--primary-color);
        }

        .user .avatar {
            background: rgba(6, 182, 212, 0.15);
            border: 1px solid rgba(6, 182, 212, 0.4);
            color: var(--accent-color);
        }

        .message-content {
            border-radius: 16px;
            padding: 12px 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slideIn 0.3s ease-out forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bot .message-content {
            background: var(--bot-bubble-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-top-left-radius: 4px;
        }

        .user .message-content {
            background: var(--user-bubble-bg);
            color: white;
            border-top-right-radius: 4px;
        }

        .message-content pre {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 8px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .message-content code {
            font-family: monospace;
            background: rgba(0,0,0,0.2);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .timestamp {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 4px;
            display: block;
            text-align: right;
        }

        .user .timestamp {
            color: rgba(255, 255, 255, 0.7);
        }

        /* Suggestions Area */
        .suggestions-container {
            padding: 12px 28px;
            display: flex;
            gap: 10px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none; /* Firefox */
        }

        .suggestions-container::-webkit-scrollbar {
            display: none; /* Safari and Chrome */
        }

        .suggestion-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .suggestion-chip:hover {
            background: rgba(99, 102, 241, 0.1);
            border-color: rgba(99, 102, 241, 0.4);
            color: var(--primary-color);
            transform: translateY(-1px);
        }

        /* Input Bar */
        .chat-input-area {
            padding: 16px 28px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(17, 24, 39, 0.4);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 0.95rem;
            padding: 8px;
            outline: none;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .send-button {
            width: 42px;
            height: 42px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-button:hover {
            background: var(--primary-hover);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
            transform: scale(1.03);
        }

        .send-button:disabled {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.3s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }

        /* Toast notifications */
        .toast {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(239, 68, 68, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.9rem;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Error Toast -->
        <div id="error-toast" class="toast">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="toast-message">Connection failed</span>
        </div>

        <!-- Chat Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="logo-container">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <div class="header-title-wrapper">
                    <h1>Banking Agent AI</h1>
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        <span>Agent Online</span>
                    </div>
                </div>
            </div>

            <div class="header-right">
                <div class="thread-input-group">
                    <label for="thread-id">Thread ID</label>
                    <input type="text" id="thread-id" class="thread-input" value="thread_12345" placeholder="thread_id">
                </div>
            </div>
        </header>

        <!-- Message History -->
        <main class="chat-messages" id="chat-messages">
            <!-- Welcome message -->
            <div class="message-row bot">
                <div class="message-wrapper">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div>
                        <div class="message-content">
                            Hello! I am your Tonik Bank AI Assistant. How can I help you with your bank account, loans, payees, or general questions today?
                            <span class="timestamp">Just now</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Quick Suggestions -->
        <div class="suggestions-container">
            <div class="suggestion-chip" onclick="useSuggestion('Search payee xavier')">
                <i class="fa-solid fa-magnifying-glass"></i> Search payee 'xavier'
            </div>
            <div class="suggestion-chip" onclick="useSuggestion('Get profile for mobile 631234567890')">
                <i class="fa-solid fa-user"></i> Get profile info
            </div>
            <div class="suggestion-chip" onclick="useSuggestion('What products does Tonik Bank offer?')">
                <i class="fa-solid fa-circle-question"></i> Account inquiries
            </div>
            <div class="suggestion-chip" onclick="useSuggestion('Help me execute a transfer')">
                <i class="fa-solid fa-money-bill-transfer"></i> Money transfer
            </div>
        </div>

        <!-- Input Box -->
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." autocomplete="off">
                <button id="send-btn" class="send-button" onclick="sendMessage()">
                    <i class="fa-solid fa-paper-plane" id="send-icon"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.origin === "null" || window.location.protocol === "file:" 
            ? "http://localhost:8000/chat" 
            : "/chat";
        const messagesContainer = document.getElementById("chat-messages");
        const chatInput = document.getElementById("chat-input");
        const threadInput = document.getElementById("thread-id");
        const sendBtn = document.getElementById("send-btn");
        const sendIcon = document.getElementById("send-icon");
        const errorToast = document.getElementById("error-toast");
        const toastMessage = document.getElementById("toast-message");

        // Allow sending message by hitting Enter key
        chatInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                sendMessage();
            }
        });

        // Initialize unique thread ID on load
        window.addEventListener("load", () => {
            const randomId = "thread_" + Math.floor(Math.random() * 900000 + 100000);
            threadInput.value = randomId;
        });

        function useSuggestion(text) {
            chatInput.value = text;
            chatInput.focus();
        }

        function showToast(message) {
            toastMessage.textContent = message;
            errorToast.classList.add("show");
            setTimeout(() => {
                errorToast.classList.remove("show");
            }, 4000);
        }

        function formatTime() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0'+minutes : minutes;
            return `${hours}:${minutes} ${ampm}`;
        }

        function appendMessage(text, sender) {
            const messageRow = document.createElement("div");
            messageRow.classList.add("message-row", sender);

            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper");

            const avatarDiv = document.createElement("div");
            avatarDiv.classList.add("avatar");
            avatarDiv.innerHTML = sender === "bot" 
                ? '<i class="fa-solid fa-robot"></i>' 
                : '<i class="fa-solid fa-user"></i>';

            const contentDiv = document.createElement("div");
            contentDiv.classList.add("message-content");
            
            // Format potential line breaks, bold text, or inline code snippets
            let formattedText = escapeHTML(text)
                .replace(/\n/g, "<br>")
                .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
                .replace(/`(.*?)`/g, "<code>$1</code>");

            contentDiv.innerHTML = formattedText;

            const timeSpan = document.createElement("span");
            timeSpan.classList.add("timestamp");
            timeSpan.textContent = formatTime();
            contentDiv.appendChild(timeSpan);

            wrapper.appendChild(avatarDiv);
            wrapper.appendChild(contentDiv);
            messageRow.appendChild(wrapper);
            messagesContainer.appendChild(messageRow);
            
            // Auto scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHTML(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function sendMessage() {
            const queryText = chatInput.value.trim();
            const threadId = threadInput.value.trim() || "default_thread";

            if (!queryText) return;

            // Clear input and display user message
            chatInput.value = "";
            appendMessage(queryText, "user");

            // Disable input and button while loading
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendIcon.className = "fa-solid fa-spinner fa-spin";

            // Add loading/typing indicator bubble
            const loadingRow = document.createElement("div");
            loadingRow.classList.add("message-row", "bot");
            loadingRow.id = "typing-loader";
            
            loadingRow.innerHTML = `
                <div class="message-wrapper">
                    <div class="avatar"><i class="fa-solid fa-robot"></i></div>
                    <div>
                        <div class="message-content">
                            <div class="typing-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(loadingRow);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                // The API expects Form Data (urlencoded or multipart)
                const formData = new URLSearchParams();
                formData.append("query", queryText);
                formData.append("thread_id", threadId);

                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned HTTP ${response.status}`);
                }

                const data = await response.json();
                
                // Remove typing indicator
                const loader = document.getElementById("typing-loader");
                if (loader) loader.remove();

                // Show bot response
                if (data && data.response) {
                    appendMessage(data.response, "bot");
                } else {
                    appendMessage("Received an empty response from the assistant.", "bot");
                }

            } catch (error) {
                console.error("Fetch Error:", error);
                
                // Remove typing indicator
                const loader = document.getElementById("typing-loader");
                if (loader) loader.remove();

                showToast("Cannot connect to local banking API.");
                appendMessage("Sorry, I'm having trouble connecting to the server. Please verify the API server is running locally on port 8000.", "bot");
            } finally {
                // Re-enable controls
                chatInput.disabled = false;
                sendBtn.disabled = false;
                sendIcon.className = "fa-solid fa-paper-plane";
                chatInput.focus();
            }
        }
    </script>
</body>
</html>
